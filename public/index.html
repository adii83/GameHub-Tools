<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>GameHub</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="tailwind.css" />

<style>
  /* shimmer skeleton */
  @keyframes shimmer {
    0% { background-position: -600px 0; }
    100% { background-position: 600px 0; }
  }
  .shimmer {
    background: linear-gradient(90deg, #1a1a1a 25%, #242424 37%, #1a1a1a 63%);
    background-size: 1200px 100%;
    animation: shimmer 1.2s infinite;
  }

  /* slide panel */
  .panel-hidden { transform: translateX(110%); opacity: 0; pointer-events: none; }
  .panel-shown  { transform: translateX(0%); opacity: 1; pointer-events: auto; }

  /* small card entrance */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .fade-up { animation: fadeUp .22s ease-out; }

  /* gallery styles removed (single header only). */

  /* Detail header sharpening: prefer crisp rendering on larger detail header */
  #detail-header { 
    width: 100%; height: 100%; display:block; object-fit: cover; image-rendering: auto; 
    transform: translateZ(0); /* promote to its own layer for sharper rendering in some browsers */
    -webkit-font-smoothing: antialiased; 
    /* subtle enhancement to make headers appear sharper and more vivid without additional fetches */
    will-change: transform;
    backface-visibility: hidden;
    filter: contrast(1.03) saturate(1.04);
  }

  /* Spinner animation */
  @keyframes gamehub-spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }

  /* Premium card remove animation */
  @keyframes cardRemove {
    0% {
      opacity: 1;
      transform: translateX(0) scale(1);
      filter: blur(0);
    }
    100% {
      opacity: 0;
      transform: translateX(-100%) scale(0.8);
      filter: blur(8px);
    }
  }
</style>

<script defer src="js/modal.js"></script>
<script defer src="js/api.js"></script>
<script defer src="js/render.js"></script>
<script defer src="js/filter.js"></script>
<script defer src="js/bridge.js"></script>
<script defer src="js/log.js"></script>
<script defer src="js/ui.js"></script>
<script defer src="js/update.js"></script>
<script defer src="js/router.js"></script>
</head>

<body class="bg-[#0f0f0f] text-white premium-scroll">
  <div class="flex">
    <!-- SIDEBAR -->
    <div id="sidebar-container"></div>

    <!-- MAIN CONTENT -->
    <div id="app-content" class="flex-1 p-6 overflow-y-auto h-screen premium-scroll"></div>
  </div>
</body>
</html>
