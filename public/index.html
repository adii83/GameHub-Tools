<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GameHub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="tailwind.css" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />

    <style>
      /* shimmer skeleton */
      @keyframes shimmer {
        0% {
          background-position: -600px 0;
        }
        100% {
          background-position: 600px 0;
        }
      }
      .shimmer {
        background: linear-gradient(
          90deg,
          #1a1a1a 25%,
          #242424 37%,
          #1a1a1a 63%
        );
        background-size: 1200px 100%;
        animation: shimmer 1.2s infinite;
      }

      /* slide panel */
      .panel-hidden {
        transform: translateX(110%);
        opacity: 0;
        pointer-events: none;
      }
      .panel-shown {
        transform: translateX(0%);
        opacity: 1;
        pointer-events: auto;
      }

      /* small card entrance */
      @keyframes fadeUp {
        from {
          opacity: 0;
          transform: translateY(6px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .fade-up {
        animation: fadeUp 0.22s ease-out;
      }

      /* gallery styles removed (single header only). */

      /* Detail header sharpening: prefer crisp rendering on larger detail header */
      #detail-header {
        width: 100%;
        height: 100%;
        display: block;
        object-fit: cover;
        image-rendering: auto;
        transform: translateZ(
          0
        ); /* promote to its own layer for sharper rendering in some browsers */
        -webkit-font-smoothing: antialiased;
        /* subtle enhancement to make headers appear sharper and more vivid without additional fetches */
        will-change: transform;
        backface-visibility: hidden;
        filter: contrast(1.03) saturate(1.04);
      }

      /* Spinner animation */
      @keyframes gamehub-spin {
        0% {
          transform: rotate(0deg);
        }
        100% {
          transform: rotate(360deg);
        }
      }

      /* Premium card remove animation */
      @keyframes cardRemove {
        0% {
          opacity: 1;
          transform: translateX(0) scale(1);
          filter: blur(0);
        }
        100% {
          opacity: 0;
          transform: translateX(-100%) scale(0.8);
          filter: blur(8px);
        }
      }
    </style>

    <script defer src="js/page-cache.js?v=3.1"></script>
    <script defer src="js/modal.js?v=3.1"></script>
    <script defer src="js/api.js?v=3.1"></script>
    <script defer src="js/render.js?v=3.1"></script>
    <script defer src="js/filter.js?v=3.1"></script>
    <script defer src="js/bridge.js?v=3.1"></script>
    <script defer src="js/log.js?v=3.1"></script>
    <script defer src="js/ui.js?v=3.1"></script>
    <script defer src="js/update.js?v=3.1"></script>
    <script defer src="js/router.js?v=3.1"></script>
  </head>

  <body class="bg-[#0f0f0f] text-white premium-scroll">
    <div
      id="global-loading-screen"
      class="fixed inset-0 z-[100] bg-[#0f0f0f] flex flex-col items-center justify-center transition-opacity duration-500"
    >
      <div
        class="animate-spin w-12 h-12 border-4 border-white/20 border-t-white rounded-full mb-6"
      ></div>
      <h2
        class="text-2xl font-black text-white tracking-[0.2em] mb-2 uppercase"
      >
        GameHub
      </h2>
      <p
        id="global-loading-text"
        class="text-sm text-white/50 animate-pulse tracking-wide uppercase"
      >
        Memuat Database...
      </p>
      <p
        id="global-loading-status"
        class="text-xs text-white/30 mt-2 tracking-wide"
        style="min-height: 1.2em"
      >
        Menyiapkan aplikasi...
      </p>
    </div>

    <div class="flex h-screen overflow-hidden">
      <!-- SIDEBAR -->
      <div id="sidebar-container" class="shrink-0 h-full"></div>

      <!-- MAIN CONTENT -->
      <div
        id="app-content"
        class="flex-1 p-6 overflow-y-auto h-full premium-scroll relative"
      ></div>
      <!-- PERSISTENT GAMES PAGE - tetap ada di DOM, hanya disembunyikan saat pindah halaman -->
      <div
        id="games-page-persistent"
        class="flex-1 p-6 overflow-y-auto h-full premium-scroll relative"
        style="display: none"
      ></div>
    </div>

    <!-- STEAM GUARD MODAL -->
    <div
      id="steam-guard-modal"
      class="fixed inset-0 z-[200] bg-black/80 flex items-center justify-center opacity-0 pointer-events-none transition-opacity duration-300"
    >
      <div
        class="bg-[#1a1a1a] border border-[#2a2a2a] rounded-xl shadow-2xl p-8 max-w-sm w-full mx-4 transform scale-95 transition-transform duration-300 relative group overflow-hidden"
      >
        <!-- Glow highlight effect typical of Steam interface -->
        <div
          class="absolute inset-0 bg-gradient-to-b from-blue-500/10 to-transparent opacity-0 group-hover:opacity-100 transition duration-500"
        ></div>
        <div
          class="absolute -top-px left-0 right-0 h-px bg-gradient-to-r from-transparent via-blue-500/50 to-transparent"
        ></div>

        <button
          onclick="
            document
              .getElementById('steam-guard-modal')
              .classList.remove('opacity-100', 'pointer-events-auto');
            document
              .getElementById('steam-guard-modal')
              .classList.add('opacity-0', 'pointer-events-none');
            document
              .getElementById('steam-guard-modal')
              .children[0].classList.replace('scale-100', 'scale-95');
          "
          class="absolute top-4 right-4 text-white/40 hover:text-white transition cursor-pointer z-10"
        >
          <i class="fa-solid fa-xmark text-lg"></i>
        </button>

        <div class="text-center relative z-10">
          <h3
            class="text-white/80 text-xl font-bold tracking-wide mb-6 uppercase"
          >
            Verifikasi kode steam anda
          </h3>

          <button
            id="steam-guard-code-btn"
            onclick="
              navigator.clipboard.writeText(this.innerText.trim());
              this.innerHTML =
                '<span class=\'text-green-400\'>TERCOPY! <i class=\'fa-solid fa-check ml-1\'></i></span>';
              setTimeout(() => (this.innerHTML = this.dataset.code), 2000);
            "
            class="w-full select-all font-black text-5xl tracking-[0.1em] text-[#3b82f6] hover:text-blue-400 hover:scale-[1.02] active:scale-95 transition cursor-pointer mb-2 transition-transform duration-200"
          >
            XXXXX
          </button>
          <p class="text-xs text-blue-500/60 mt-4 pointer-events-none">
            *(Klik Kode Untuk Menyalin)*
          </p>
        </div>
      </div>
    </div>
  </body>
</html>
