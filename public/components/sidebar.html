<div class="w-48 h-screen bg-[#141414] border-r border-white/5 flex flex-col p-4">
  <h1 class="text-white font-bold text-xl mb-6 tracking-wide">GameHub</h1>

  <nav class="flex flex-col gap-2 h-full">
    <button onclick="navigate('dashboard')" id="nav-dashboard"
      class="flex items-center gap-3 px-3 py-2 rounded-md text-gray-300 hover:bg-white/5 hover:text-white transition">
      <span>🏠</span><span>Dashboard</span>
    </button>

    <button onclick="navigate('games')" id="nav-games"
      class="flex items-center gap-3 px-3 py-2 rounded-md text-gray-300 hover:bg-white/5 hover:text-white transition">
      <span>🎮</span><span>Games</span>
    </button>

    <!-- Library navigation removed -->

    <div class="flex-1"></div>

    <button onclick="window.ui?.openLogSidebar?.()" id="nav-logs"
      class="mt-auto flex items-center gap-3 px-3 py-2 rounded-md text-gray-300 hover:bg-white/5 hover:text-white transition">
      <span>🧾</span><span>Logs</span>
    </button>

    <!-- UPDATE section -->
    <div class="mt-4 border-t border-white/10 pt-3 text-xs text-gray-500 uppercase tracking-wide">Update</div>

    <button onclick="checkOverrideUpdate()" id="btn-check-update"
      class="mt-1 flex items-center gap-3 px-3 py-2 rounded-md text-gray-400 hover:bg-white/5 hover:text-blue-400 transition text-sm">
      <span>🔄</span><span>Check Update</span>
    </button>

    <!-- CLEAR section -->
    <div class="mt-4 border-t border-white/10 pt-3 text-xs text-gray-500 uppercase tracking-wide">Clear</div>

    <button onclick="if(confirm('Hapus cache tampilan? Data game utama tetap disimpan.')) { clearUiCacheOnly(); }"
      class="mt-1 flex items-center gap-3 px-3 py-2 rounded-md text-gray-400 hover:bg-white/5 hover:text-yellow-300 transition text-sm">
      <span>🧹</span><span>Clear Cache</span>
    </button>

    <button onclick="if(confirm('Hapus semua data & cache? Dataset akan di-download ulang seperti pertama kali.')) { clearAllCache(); }" 
      class="mt-1 flex items-center gap-3 px-3 py-2 rounded-md text-gray-400 hover:bg-white/5 hover:text-red-400 transition text-sm">
      <span>🗑️</span><span>Clear Data</span>
    </button>
  </nav>
</div>
