<div class="flex items-center justify-between mb-4">
  <h1 class="text-3xl font-bold">Games</h1>

  <div class="flex items-center gap-2">
    <input id="searchInput" oninput="debouncedApplyFilters()" onkeydown="onSearchKeyDown(event)"
      class="px-3 py-2 rounded-md bg-[#151515] border border-white/5 text-sm w-64"
      placeholder="Search games... (Enter to search online)" />

    <button onclick="performRemoteSearch()"
      class="px-3 py-2 rounded-md bg-purple-600 hover:bg-purple-700 border border-white/5 text-sm transition text-white">
      Cari
    </button>

    <button onclick="refreshGithubRaw()"
      class="px-3 py-2 rounded-md bg-gray-700 hover:bg-gray-600 border border-white/5 text-sm transition text-white">
      Refresh Raw
    </button>
    <button onclick="toggleFilterPanel()"
      class="px-3 py-2 rounded-md bg-white/5 hover:bg-white/10 border border-white/5 text-sm transition">
      Filters
    </button>
  </div>
</div>

<div class="relative flex gap-6">
  <!-- LIST -->
  <div class="flex-1">
    <div id="game-list" class="flex flex-col gap-4"></div>

    <!-- PAGINATION -->
    <div id="pagination" class="flex items-center gap-2 mt-6"></div>
  </div>

  <!-- FILTER PANEL (KANAN, SLIDE) -->
  <div id="filter-panel-wrapper"
       class="w-64 fixed right-6 top-20 transition-all duration-300 ease-out panel-hidden">
    <div id="filter-panel"></div>
  </div>
</div>

<!-- DETAIL DRAWER (slide-over right) -->
<div id="detail-drawer" class="fixed inset-0 z-50 hidden">
  <div id="drawer-overlay" class="absolute inset-0 bg-black/60"></div>
  <div id="detail-drawer-panel" class="absolute right-0 top-0 h-full w-[48rem] max-w-[95vw] bg-[#151515] border border-white/10 rounded-l-2xl shadow-2xl p-5 transform transition-transform duration-300 panel-hidden">
    <div id="detail-card" class="h-full overflow-auto">
      <!-- content injected -->
    </div>
  </div>
</div>
